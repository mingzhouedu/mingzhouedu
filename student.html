<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>英语学习 - 明舟教育</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft YaHei", sans-serif;
}
body {
  background: #fff8e1;
  padding: 30px 20px;
}
.back-btn {
  display: inline-block;
  padding: 10px 20px;
  background: #ff9800;
  color: #fff;
  border-radius: 30px;
  cursor: pointer;
  margin-bottom: 20px;
}
.container {
  max-width: 800px;
  margin: 0 auto;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}
h2 {
  color: #e65100;
  margin-bottom: 15px;
}
.word {
  font-size: 22px;
  font-weight: bold;
  margin: 10px 0;
  color: #333;
}
.reading {
  line-height: 1.7;
  font-size: 16px;
  color: #444;
}
</style>
</head>
<body>

<div class="back-btn" onclick="location.href='index.html'">← 返回主页</div>

<div class="container">
  <div class="card">
    <h2>单词记忆</h2>
    <div class="word">apple - 苹果</div>
    <div class="word">banana - 香蕉</div>
    <div class="word">orange - 橙子</div>
    <div class="word">pear - 梨</div>
  </div>

  <div class="card">
    <h2>英语小阅读</h2>
    <p class="reading">
      I like apples. They are red and round. I eat an apple every day. It is good for me.
      I like bananas too. They are yellow and long.
    </p>
  </div>
</div>

</body>
</html>
