<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>英语学习 - 明舟教育</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
        body{background:#fff8e1;padding:20px;max-width:900px;margin:0 auto;}
        .header{background:#ff9800;color:white;padding:20px;text-align:center;border-radius:12px;margin-bottom:20px;}
        .back{padding:10px 20px;background:#e65100;color:white;border:none;border-radius:30px;cursor:pointer;margin-bottom:15px;}
        .tab-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
        .tab{padding:14px;text-align:center;background:white;border:2px solid #ffcc80;border-radius:8px;cursor:pointer;}
        .tab.active{background:#ff9800;color:white;}
        .panel{background:white;padding:25px;border-radius:12px;display:none;}
        .panel.active{display:block;}
        .word-card{padding:15px;background:#fff4e2;border-radius:8px;margin:10px 0;font-size:18px;}
        .read-box{line-height:1.8;padding:20px;background:#fdf6e3;border-radius:10px;}
        .voice-btn{padding:8px 16px;background:#0288d1;color:white;border:none;border-radius:20px;cursor:pointer;margin-left:10px;}
    </style>
</head>
<body>
<button class="back" onclick="location.href='index.html'">← 返回主页</button>
<div class="header">
    <h1>📚 英语学习中心</h1>
</div>
<div class="tab-bar">
    <div class="tab active" onclick="switchTab(0)">单词记忆</div>
    <div class="tab" onclick="switchTab(1)">英语阅读</div>
    <div class="tab" onclick="switchTab(2)">发音训练</div>
</div>
<div class="panel active" id="p0">
    <div class="word-card">apple - 苹果 <button class="voice-btn" onclick="speak('apple')">发音</button></div>
    <div class="word-card">banana - 香蕉 <button class="voice-btn" onclick="speak('banana')">发音</button></div>
    <div class="word-card">orange - 橙子 <button class="voice-btn" onclick="speak('orange')">发音</button></div>
</div>
<div class="panel" id="p1">
    <div class="read-box">
        I am a student. I like apples and bananas. They are good for me.
        I learn English every day. Reading is fun!
    </div>
</div>
<div class="panel" id="p2">
    <p>点击单词按钮即可听标准发音，支持跟读训练</p>
</div>
<script>
function switchTab(i){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('p'+i).classList.add('active');document.querySelectorAll('.tab')[i].classList.add('active');}
function speak(word){let u = new SpeechSynthesisUtterance(word);u.lang='en-US';speechSynthesis.speak(u);}
</script>
</body>
</html>
