<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>明舟教育 - 舟楫载梦 明灯指路</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft YaHei", sans-serif;
}

/* 全屏基础样式，无任何外部图片 */
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(to bottom, #4fc3f7, #b3e5fc);
  position: relative;
}

/* 标题 */
.header {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 99;
}
.title {
  font-size: 48px;
  color: #01579b;
  font-weight: bold;
}
.slogan {
  font-size: 24px;
  color: #0288d1;
  margin-top: 10px;
}

/* 太阳（左侧远方，不重叠） */
.sun {
  position: absolute;
  bottom: 260px;
  left: 150px;
  width: 120px;
  height: 120px;
  background: #ffeb3b;
  border-radius: 50%;
  box-shadow: 0 0 50px #ffeb3b;
}

/* 海平面 */
.sea {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 250px;
  background: #0288d1;
  border-top: 4px solid #01579b;
}

/* 灯塔（右侧，简洁美观） */
.lighthouse {
  position: absolute;
  right: 180px;
  bottom: 240px;
  width: 60px;
  height: 300px;
  background: #ffffff;
  border-left: 6px solid #333;
  border-right: 6px solid #333;
}
.lighthouse::before {
  content: '';
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 30px solid transparent;
  border-right: 30px solid transparent;
  border-bottom: 30px solid #e53935;
}
.light {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 20px;
  background: #ffeb3b;
  border-radius: 50%;
}

/* 帆船按钮（简洁大气，贴在海面） */
.boat {
  position: absolute;
  width: 200px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  color: white;
  background: #ff9800;
  border-radius: 35px;
  cursor: pointer;
  transition: 0.3s;
  z-index: 10;
}
.boat:hover {
  transform: translateY(-5px);
  background: #f57c00;
}

/* 帆船位置，绝对不重叠 */
#boat1 { bottom: 200px; left: 400px; }
#boat2 { bottom: 300px; left: 400px; }

/* 帆船动画 */
.sail {
  animation: sailAway 3s ease forwards;
}
@keyframes sailAway {
  0% { opacity: 1; transform: translate(0,0); }
  100% { opacity: 0; transform: translate(-500px, -200px); }
}
</style>
</head>

<body>
<!-- 标题 -->
<div class="header">
  <div class="title">明舟教育</div>
  <div class="slogan">舟楫载梦 · 明灯指路</div>
</div>

<!-- 场景元素 -->
<div class="sun"></div>
<div class="sea"></div>
<div class="lighthouse"><div class="light"></div></div>

<!-- 功能帆船 -->
<div class="boat" id="boat1" onclick="go('student.html',this)">英语学习</div>
<div class="boat" id="boat2" onclick="go('math-index.html',this)">数学作业</div>

<script>
function go(url, el) {
  el.style.pointerEvents = "none";
  el.classList.add("sail");
  setTimeout(() => location.href = url, 3000);
}
</script>
</body>
</html>
