<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>明舟教育 - 统一登录</title>
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0;}
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: white;
            width: 420px;
            padding: 45px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #165DFF;
            margin-bottom: 35px;
            font-weight: 600;
        }
        select, input {
            width: 100%;
            padding: 13px 15px;
            margin: 10px 0;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 15px;
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #165DFF;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-btn:hover {
            background: #0d47a1;
        }
        .test-tip {
            margin-top: 25px;
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>明舟教育学习系统</h2>
        <select id="login-role">
            <option value="student">👨‍🎓 学生端</option>
            <option value="teacher">👨‍🏫 教师端</option>
        </select>
        <input type="text" id="login-account" placeholder="请输入账号">
        <input type="password" id="login-pwd" placeholder="请输入密码">
        <button class="login-btn" onclick="handleLogin()">登录系统</button>
        <div class="test-tip">
            测试账号：<br>
            学生：student / 123456<br>
            教师：teacher / 123456
        </div>
    </div>

    <script>
        // ====================== 简化版登录逻辑（直接写在index里，不依赖common.js） ======================
        // 硬编码测试账号，确保能登录
        const testAccounts = {
            teacher: { account: "teacher", pwd: "123456" },
            students: [
                { account: "student", pwd: "123456" }
            ]
        };

        function handleLogin() {
            const role = document.getElementById('login-role').value;
            const account = document.getElementById('login-account').value.trim();
            const pwd = document.getElementById('login-pwd').value.trim();

            // 简单校验
            if(!account || !pwd) {
                alert('请输入账号和密码');
                return;
            }

            // 教师登录
            if(role === 'teacher') {
                if(account === testAccounts.teacher.account && pwd === testAccounts.teacher.pwd) {
                    // 保存登录状态
                    sessionStorage.setItem('currentUser', JSON.stringify({ role: 'teacher', account }));
                    // 选择学科
                    const choose = confirm('【确定】进入英语管理\n【取消】进入数学管理');
                    if(choose) {
                        window.location.href = 'teacher-english.html';
                    } else {
                        window.location.href = 'teacher-math.html';
                    }
                    return;
                } else {
                    alert('教师账号或密码错误');
                    return;
                }
            }

            // 学生登录
            if(role === 'student') {
                const validStudent = testAccounts.students.find(s => s.account === account && s.pwd === pwd);
                if(validStudent) {
                    // 保存登录状态
                    sessionStorage.setItem('currentUser', JSON.stringify({ role: 'student', account }));
                    // 选择学科
                    const choose = confirm('【确定】进入英语学习\n【取消】进入数学作业');
                    if(choose) {
                        window.location.href = 'student-english.html';
                    } else {
                        window.location.href = 'student-math.html';
                    }
                    return;
                } else {
                    alert('学生账号或密码错误');
                    return;
                }
            }
        }
    </script>
</body>
</html>
