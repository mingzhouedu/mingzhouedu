<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>英语学习系统</title>
    <style>
        * {
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        /* 登录页面 */
        .login-box {
            width: 400px;
            margin: 80px auto;
            padding: 30px;
            border: 1px solid #eee;
            border-radius: 10px;
            box-shadow: 0 0 10px #eee;
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #2d8cf0;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button.danger {
            background: #f56c6c;
        }
        .title {
            text-align: center;
            padding: 15px;
            background: #f5f7fa;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        /* 模块卡片 */
        .card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .card h3 {
            border-left: 4px solid #2d8cf0;
            padding-left: 10px;
            margin-bottom: 10px;
        }
        /* 列表样式 */
        .item {
            padding: 8px;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* 隐藏模块 */
        .hide {
            display: none;
        }
        /* 按钮小样式 */
        .mini-btn {
            width: auto;
            padding: 5px 10px;
            margin: 0 3px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ====================================== -->
    <!-- 1. 登录页面（默认显示） -->
    <!-- ====================================== -->
    <div id="loginPage" class="login-box">
        <h2>系统登录</h2>
        <select id="role">
            <option value="teacher">教师端</option>
            <option value="student">学生端</option>
        </select>
        <input type="text" id="account" placeholder="账号">
        <input type="password" id="pwd" placeholder="密码">
        <button onclick="login()">登录</button>
    </div>

    <!-- ====================================== -->
    <!-- 2. 教师端（登录后显示） -->
    <!-- ====================================== -->
    <div id="teacherPage" class="hide">
        <div class="title">
            <h1>教师管理控制台</h1>
            <button class="mini-btn danger" onclick="logout()">退出登录</button>
        </div>

        <!-- 教师功能1：班级管理 -->
        <div class="card">
            <h3>📚 班级管理</h3>
            <input type="text" id="className" placeholder="输入班级名称（如：初一1班）">
            <button onclick="addClass()">新增班级</button>
            <div id="classList"></div>
        </div>

        <!-- 教师功能2：学生管理 -->
        <div class="card">
            <h3>👨‍🎓 学生管理</h3>
            <input type="text" id="stuName" placeholder="学生姓名">
            <input type="text" id="stuAccount" placeholder="学生账号（用于登录）">
            <input type="password" id="stuPwd" placeholder="学生密码">
            <select id="stuClass"></select>
            <button onclick="addStudent()">添加学生</button>
            <div id="stuList"></div>
        </div>

        <!-- 教师功能3：词书&单词管理 -->
        <div class="card">
            <h3>📖 词书与单词管理</h3>
            <select id="bookClass"></select>
            <input type="text" id="bookName" placeholder="词书名称（如：七年级上册单词）">
            <button onclick="addBook()">创建词书</button>
            
            <hr>
            <h4>添加单词到词书</h4>
            <select id="selectBook"></select>
            <input type="text" id="word" placeholder="英文单词/词组">
            <input type="text" id="wordMean" placeholder="中文释义">
            <button onclick="addWordToBook()">添加单词</button>
            <div id="wordList"></div>
        </div>
    </div>

    <!-- ====================================== -->
    <!-- 3. 学生端（登录后显示） -->
    <!-- ====================================== -->
    <div id="studentPage" class="hide">
        <div class="title">
            <h1>学生学习中心</h1>
            <button class="mini-btn danger" onclick="logout()">退出登录</button>
        </div>

        <!-- 学生功能1：查看老师分配的词书 -->
        <div class="card">
            <h3>📚 我的词书</h3>
            <select id="studentBook"></select>
            <button onclick="loadStudentWords()">查看单词</button>
            <div id="studentWordList"></div>
        </div>

        <!-- 学生功能2：认单词 + 听音读单词 -->
        <div class="card">
            <h3>✅ 单词测试（认+读）</h3>
            <button onclick="startStudentTest()">开始测试</button>
            <div id="testArea"></div>
        </div>
    </div>
</div>

<script>
// ==========================
// 全局数据（本地永久存储）
// ==========================
let data = JSON.parse(localStorage.getItem('englishSystem')) || {
    // 固定教师账号
    teacher: { account: "teacher", pwd: "123456" },
    // 班级
    classes: [],
    // 学生
    students: [],
    // 词书
    books: [],
    // 单词
    words: []
};

// 当前登录用户
let currentUser = null;

// ==========================
// 1. 登录/退出功能
// ==========================
function login() {
    let role = document.getElementById('role').value;
    let account = document.getElementById('account').value;
    let pwd = document.getElementById('pwd').value;

    // 教师登录
    if(role === 'teacher') {
        if(account === data.teacher.account && pwd === data.teacher.pwd) {
            currentUser = {role:'teacher'};
            showPage('teacher');
            initTeacherPage();
            return;
        }
    }

    // 学生登录
    if(role === 'student') {
        let stu = data.students.find(s=>s.account === account && s.pwd === pwd);
        if(stu) {
            currentUser = {role:'student', info:stu};
            showPage('student');
            initStudentPage();
            return;
        }
    }
    alert('账号或密码错误！');
}

// 退出登录
function logout() {
    currentUser = null;
    showPage('login');
}

// 切换页面
function showPage(type) {
    document.getElementById('loginPage').classList.add('hide');
    document.getElementById('teacherPage').classList.add('hide');
    document.getElementById('studentPage').classList.add('hide');
    document.getElementById(type+'Page').classList.remove('hide');
}

// 保存数据到本地
function saveData() {
    localStorage.setItem('englishSystem', JSON.stringify(data));
}

// ==========================
// 2. 教师端功能
// ==========================
// 初始化教师页面
function initTeacherPage() {
    renderClass();
    renderStudent();
    renderBook();
}

// 班级管理 - 新增
function addClass() {
    let name = document.getElementById('className').value;
    if(!name) return alert('请输入班级名');
    data.classes.push({id:Date.now(), name});
    saveData();
    renderClass();
    document.getElementById('className').value = '';
}

// 渲染班级列表
function renderClass() {
    let dom = '';
    data.classes.forEach(item=>{
        dom += `<div class="item">${item.name}</div>`;
    });
    document.getElementById('classList').innerHTML = dom;

    // 绑定到学生/词书下拉框
    let sel = `<option value="">选择班级</option>`;
    data.classes.forEach(item=>{
        sel += `<option value="${item.id}">${item.name}</option>`;
    });
    document.getElementById('stuClass').innerHTML = sel;
    document.getElementById('bookClass').innerHTML = sel;
}

// 学生管理 - 新增
function addStudent() {
    let name = document.getElementById('stuName').value;
    let account = document.getElementById('stuAccount').value;
    let pwd = document.getElementById('stuPwd').value;
    let classId = document.getElementById('stuClass').value;
    if(!name||!account||!pwd||!classId) return alert('请填写完整信息');
    
    data.students.push({
        id:Date.now(), name, account, pwd, classId
    });
    saveData();
    renderStudent();
    document.getElementById('stuName').value='';
    document.getElementById('stuAccount').value='';
    document.getElementById('stuPwd').value='';
}

// 渲染学生列表
function renderStudent() {
    let dom = '';
    data.students.forEach(stu=>{
        let className = data.classes.find(c=>c.id==stu.classId)?.name || '无班级';
        dom += `<div class="item">${stu.name} | 账号：${stu.account} | ${className}</div>`;
    });
    document.getElementById('stuList').innerHTML = dom;
}

// 词书管理 - 创建
function addBook() {
    let classId = document.getElementById('bookClass').value;
    let name = document.getElementById('bookName').value;
    if(!classId||!name) return alert('请选择班级+填写词书名');
    
    data.books.push({
        id:Date.now(), classId, name
    });
    saveData();
    renderBook();
    document.getElementById('bookName').value='';
}

// 渲染词书
function renderBook() {
    let sel = `<option value="">选择词书</option>`;
    data.books.forEach(book=>{
        let className = data.classes.find(c=>c.id==book.classId)?.name;
        sel += `<option value="${book.id}">${className} - ${book.name}</option>`;
    });
    document.getElementById('selectBook').innerHTML = sel;
}

// 添加单词到词书
function addWordToBook() {
    let bookId = document.getElementById('selectBook').value;
    let word = document.getElementById('word').value;
    let mean = document.getElementById('wordMean').value;
    if(!bookId||!word||!mean) return alert('填写完整');
    
    data.words.push({bookId, word, mean});
    saveData();
    renderWordList(bookId);
    document.getElementById('word').value='';
    document.getElementById('wordMean').value='';
}

// 渲染单词列表
function renderWordList(bookId) {
    let dom = '';
    data.words.filter(w=>w.bookId==bookId).forEach(item=>{
        dom += `<div class="item">${item.word} → ${item.mean}</div>`;
    });
    document.getElementById('wordList').innerHTML = dom;
}

// ==========================
// 3. 学生端功能
// ==========================
// 初始化学生页面
function initStudentPage() {
    // 加载学生班级的词书
    let classId = currentUser.info.classId;
    let sel = `<option value="">选择词书</option>`;
    data.books.filter(b=>b.classId==classId).forEach(book=>{
        sel += `<option value="${book.id}">${book.name}</option>`;
    });
    document.getElementById('studentBook').innerHTML = sel;
}

// 学生查看单词
function loadStudentWords() {
    let bookId = document.getElementById('studentBook').value;
    let dom = '';
    data.words.filter(w=>w.bookId==bookId).forEach(item=>{
        dom += `<div class="item">${item.word} → ${item.mean} 
                    <button class="mini-btn" onclick="playVoice('${item.word}')">🔊 读音</button>
                </div>`;
    });
    document.getElementById('studentWordList').innerHTML = dom;
}

// 播放单词发音
function playVoice(word) {
    let u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    window.speechSynthesis.speak(u);
}

// 学生单词测试（认单词 + 听音）
function startStudentTest() {
    let bookId = document.getElementById('studentBook').value;
    let words = data.words.filter(w=>w.bookId==bookId);
    if(words.length===0) return alert('词书为空');
    
    let rand = words[Math.floor(Math.random()*words.length)];
    document.getElementById('testArea').innerHTML = `
        <div class="card">
            <p>英文：${rand.word}</p>
            <button class="mini-btn" onclick="playVoice('${rand.word}')">🔊 听读音</button>
            <input type="text" id="userAns" placeholder="输入中文释义">
            <button onclick="checkAns('${rand.mean}')">提交</button>
        </div>
    `;
}

// 核对答案
function checkAns(right) {
    let ans = document.getElementById('userAns').value;
    if(ans === right) alert('✅ 回答正确！');
    else alert(`❌ 错误，正确答案：${right}`);
}
</script>
</body>
</html>
